<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truth Ranker</title>
<style>
  /* Apple-ish: system font, generous whitespace, very few colours,
     one accent, hairline rules instead of boxes, restrained motion. */
  :root {
    --bg:      #fbfbfd;
    --surface: #ffffff;
    --text:    #1d1d1f;
    --muted:   #6e6e73;
    --hair:    #d2d2d7;
    --accent:  #0071e3;
    --good:    #1d8a4e;
    --warn:    #b25000;
    --bad:     #c8102e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#000; --surface:#1c1c1e; --text:#f5f5f7; --muted:#98989d;
      --hair:#38383a; --accent:#2997ff; --good:#30d158; --warn:#ff9f0a; --bad:#ff453a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font: 17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    letter-spacing: -0.01em;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 22px; }

  /* ---- hero ---- */
  header { text-align:center; padding: 88px 0 20px; }
  h1 {
    margin:0 0 14px; font-size: 56px; line-height:1.05;
    font-weight: 600; letter-spacing:-0.025em;
  }
  header p { margin:0 auto; max-width: 620px; font-size: 21px; color:var(--muted); line-height:1.38; }

  /* ---- segmented control ---- */
  nav { display:flex; justify-content:center; margin: 44px 0 10px; }
  .seg {
    display:inline-flex; background: color-mix(in srgb, var(--muted) 12%, transparent);
    border-radius: 980px; padding: 3px;
  }
  .seg button {
    border:0; background:transparent; color:var(--text); cursor:pointer;
    font-size:14px; font-weight:500; padding: 8px 20px; border-radius: 980px;
    transition: background .25s ease;
  }
  .seg button.on { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  .count { text-align:center; color:var(--muted); font-size:13px; margin: 18px 0 30px; }

  /* ---- product row ---- */
  .item {
    display:grid; grid-template-columns: 260px 1fr auto; gap: 36px;
    align-items:start; padding: 44px 0; border-top: 1px solid var(--hair);
  }
  .item:first-of-type { border-top: 0; }

  .shot {
    width:260px; height:260px; border-radius:20px; background:#fff;
    border:1px solid var(--hair); object-fit:contain; padding:18px;
  }
  /* Typographic fallback when a listing has no photo. */
  .shot.blank {
    display:flex; align-items:center; justify-content:center; background:var(--surface);
    font-size:60px; font-weight:600; color:var(--muted); letter-spacing:-0.02em;
  }

  /* ---- verdict bullets ---- */
  .points { margin:0; padding:0; list-style:none; }
  .points li {
    position:relative; padding-left:17px; margin-bottom:7px; font-size:15px; line-height:1.5;
  }
  .points li:last-child { margin-bottom:0; }
  .points li::before {
    content:''; position:absolute; left:0; top:9px;
    width:5px; height:5px; border-radius:50%; background:var(--muted);
  }

  .name { font-size:19px; font-weight:600; letter-spacing:-0.02em; margin:0 0 3px; }
  .meta { color:var(--muted); font-size:14px; margin:0 0 14px; }
  .verdict { margin:0; font-size:15px; line-height:1.5; }

  /* ---- score ---- */
  .score { text-align:right; min-width:92px; }
  .num { font-size:40px; font-weight:600; letter-spacing:-0.03em; line-height:1; }
  .outof { font-size:12px; color:var(--muted); margin-top:3px; }

  /* ---- tags ---- */
  .tags { display:flex; gap:7px; flex-wrap:wrap; margin:12px 0 0; }
  .tag {
    font-size:11px; font-weight:500; letter-spacing:.01em;
    padding:3px 9px; border-radius:980px; border:1px solid var(--hair); color:var(--muted);
  }
  .tag.strong { color:var(--good); border-color:currentColor; }
  .tag.mixed  { color:var(--warn); border-color:currentColor; }
  .tag.hype   { color:var(--bad);  border-color:currentColor; }

  /* ---- callout ---- */
  .callout {
    margin-top:16px; padding:14px 16px; border-radius:12px; font-size:14px; line-height:1.45;
    background: color-mix(in srgb, var(--bad) 8%, transparent);
    color: var(--bad);
  }
  .callout.gem { background: color-mix(in srgb, var(--good) 9%, transparent); color: var(--good); }
  .callout b { font-weight:600; }

  /* ---- disclosure ---- */
  details { margin-top:16px; }
  summary {
    cursor:pointer; color:var(--accent); font-size:14px; list-style:none;
  }
  summary::-webkit-details-marker { display:none; }
  summary::after { content:" ›"; }
  details[open] summary::after { content:" ⌄"; }
  .detail { margin-top:14px; font-size:14px; color:var(--muted); line-height:1.6; white-space:pre-wrap; }

  /* ---- community themes ---- */
  .themes { margin-top:18px; }
  .themes h3 {
    font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); margin:0 0 10px;
  }
  .theme { display:flex; gap:11px; align-items:baseline; padding:7px 0; font-size:14px; }
  .dot { flex:none; width:7px; height:7px; border-radius:50%; margin-top:6px; }
  .dot.positive { background:var(--good); }
  .dot.negative { background:var(--bad); }
  .dot.mixed    { background:var(--warn); }
  .theme .label { font-weight:600; }
  .theme .n {
    font-size:11px; color:var(--muted); border:1px solid var(--hair);
    border-radius:980px; padding:1px 7px; margin-left:2px;
  }
  .theme .q { color:var(--muted); font-style:italic; display:block; margin-top:3px; font-size:13px; }

  /* ---- citations ---- */
  .sources { margin-top:18px; }
  .sources h3 {
    font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); margin:0 0 10px;
  }
  .src { display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--hair); font-size:13px; line-height:1.45; }
  .src:first-of-type { border-top:0; }
  .src a { color:var(--text); text-decoration:none; font-weight:500; }
  .src a:hover { color:var(--accent); text-decoration:underline; }
  .src .j { color:var(--muted); display:block; margin-top:2px; font-size:12px; }
  /* Study-design badge: a trial should look different from a commentary. */
  .lvl {
    flex:none; font-size:10px; font-weight:600; letter-spacing:.02em;
    padding:2px 7px; border-radius:980px; height:fit-content; margin-top:1px;
    border:1px solid var(--hair); color:var(--muted); white-space:nowrap;
  }
  .lvl.s5, .lvl.s4 { color:var(--good); border-color:currentColor; }
  .bars { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin:18px 0; }
  .bl { font-size:12px; color:var(--muted); display:flex; justify-content:space-between; margin-bottom:6px; }
  .track { height:3px; background:var(--hair); border-radius:2px; overflow:hidden; }
  .fill { height:100%; background:var(--text); border-radius:2px; }

  .empty { text-align:center; color:var(--muted); padding:100px 20px; font-size:15px; line-height:1.9; }
  code { font: 13px/1.6 "SF Mono", ui-monospace, Menlo, monospace;
         background:color-mix(in srgb,var(--muted) 14%,transparent); padding:3px 7px; border-radius:5px; }

  footer {
    border-top:1px solid var(--hair); margin-top:70px; padding:26px 0 70px;
    color:var(--muted); font-size:12px; line-height:1.7;
  }

  @media (max-width: 900px) {
    .item { grid-template-columns:170px 1fr; gap:24px; }
    .shot { width:170px; height:170px; }
    .shot.blank { font-size:40px; }
    .score { grid-column:2; text-align:left; margin-top:10px; }
  }
  @media (max-width: 640px) {
    h1 { font-size:36px; } header { padding-top:56px; } header p { font-size:17px; }
    .item { grid-template-columns:1fr; gap:18px; }
    .shot { width:100%; height:220px; }
    .shot.blank { font-size:44px; }
    .score { grid-column:1; }
    .num { font-size:30px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Truth Ranker</h1>
    <p>Sunscreens ranked by what the published evidence supports — not by how well they sell.</p>
  </header>

  <nav>
    <div class="seg">
      <button class="on" data-view="rankings">Ranked</button>
      <button data-view="hyped">Overhyped</button>
      <button data-view="underrated">Underrated</button>
    </div>
  </nav>

  <p class="count" id="count"></p>
  <main id="list"><div class="empty">Loading…</div></main>

  <footer>
    Research synthesis, not medical advice. Safety claims are attributed to the FDA, never asserted by us.
    Every verdict carries its sources and a confidence level.
  </footer>
</div>

<script>
const list  = document.getElementById('list');
const count = document.getElementById('count');

const scoreColour = s => s >= 70 ? 'var(--good)' : s >= 50 ? 'var(--warn)' : 'var(--bad)';
const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Amazon encodes the requested size in the filename (._SY300_SX300_ etc).
// Swapping that segment asks their CDN for a larger render, which is much
// sharper than letting the browser upscale a 300px thumbnail.
function bigImage(url) {
  return url.replace(/\._[A-Z0-9_,]+_\.(jpg|png|webp)/i, '._SL800_.$1');
}

// No photo on the listing -> show the brand's initials rather than a broken image.
function shot(p) {
  if (p.image_url) {
    const initials = esc((p.brand || '?').slice(0, 2).toUpperCase());
    return `<img class="shot" src="${esc(bigImage(p.image_url))}" alt="${esc(p.name)}" loading="lazy"
             onerror="this.onerror=null;this.src='${esc(p.image_url)}'">`;
  }
  return `<div class="shot blank">${esc((p.brand || '?').slice(0, 2).toUpperCase())}</div>`;
}

// Verdicts sometimes cite inline as [PMID 12345](url). Escape first (so the
// text can never inject HTML), then turn those markdown links into real ones.
function verdictHtml(text) {
  const linked = esc(text ?? '')
    .replace(/\[([^\]]+)\]\((https:\/\/pubmed\.ncbi\.nlm\.nih\.gov\/\d+\/?)\)/g,
             '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // Verdicts come back as "- bullet" lines. Render them as a real list.
  const lines = linked.split('\n').map(l => l.trim()).filter(Boolean);
  const bullets = lines.filter(l => l.startsWith('-') || l.startsWith('•'));
  if (bullets.length >= 2) {
    return '<ul class="points">' +
      bullets.map(b => `<li>${b.replace(/^[-•]\s*/, '')}</li>`).join('') + '</ul>';
  }
  return lines.join('<br>');
}

// Study design, from the PublicationType ranking in tools/pubmed.py.
// Readers deserve to know whether a claim rests on a trial or a commentary.
const DESIGN = {5:'meta-analysis', 4:'trial', 3:'clinical study', 2:'review', 1:'article', 0:'article'};

// What people repeatedly say about the product. Only themes several
// different commenters raised independently -- one person's experience is
// an anecdote, four people's is a property of the product.
function themes(p) {
  const list = p.themes || [];
  if (!list.length) return '';
  return `<div class="themes">
    <h3>What people keep saying</h3>
    ${list.map(t => `<div class="theme">
      <span class="dot ${esc(t.sentiment)}"></span>
      <span>
        <span class="label">${esc(t.theme)}</span><span class="n">${t.mentions} mentions</span>
        <span class="q">${esc(t.summary)}${t.quote ? ` &ldquo;${esc(t.quote)}&rdquo;` : ''}</span>
      </span>
    </div>`).join('')}
  </div>`;
}

// Top 3 cited papers, strongest design first.
function sources(p) {
  const list = (p.sources || []).slice(0, 3);
  if (!list.length) return '';
  return `<div class="sources">
    <h3>Top sources</h3>
    ${list.map(s => `<div class="src">
      <span class="lvl s${s.strength}">${DESIGN[s.strength] || 'article'}</span>
      <span>
        <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>
        <span class="j">${esc(s.journal)}${s.year ? ' · ' + esc(s.year) : ''} · PMID ${esc(s.pmid)}</span>
      </span>
    </div>`).join('')}
  </div>`;
}

function row(p) {
  const subs = p.subscores || {};
  const bars = ['efficacy','ingredients','sentiment'].map(k => {
    const v = Math.round(subs[k] ?? 0);
    return `<div><div class="bl"><span>${k}</span><span>${v}</span></div>
            <div class="track"><div class="fill" style="width:${v}%"></div></div></div>`;
  }).join('');

  // Terse on purpose. The numbers are right there; a sentence explaining
  // them is noise.
  let callout = '';
  if (p.hype_gap > 25) {
    callout = `<div class="callout"><b>Hyped.</b>
      #${p.bestseller_rank} on Amazon, ${Math.round(p.score)}/100 on evidence.</div>`;
  } else if (p.hype_gap < -20) {
    callout = `<div class="callout gem"><b>Underrated.</b>
      ${Math.round(p.score)}/100 on evidence, only #${p.bestseller_rank} in sales.</div>`;
  }

  const tags = [
    `<span class="tag ${p.confidence}">${p.confidence} evidence</span>`,
    p.is_safe ? '' : '<span class="tag hype">FDA recall on record</span>',
  ].join('');

  return `<article class="item">
    ${shot(p)}
    <div>
      <h2 class="name">${esc(p.name)}</h2>
      <p class="meta">${esc(p.brand)} · $${(p.price ?? 0).toFixed(2)} · Amazon #${p.bestseller_rank ?? '—'}</p>
      <p class="verdict">${verdictHtml(p.verdict)}</p>
      <div class="tags">${tags}</div>
      ${callout}
      ${themes(p)}
      ${sources(p)}
      <details>
        <summary>Full research findings and ingredients</summary>
        <div class="bars">${bars}</div>
        <div class="detail">${esc(p.expert_findings) || 'No findings recorded.'}</div>
        <div class="detail"><b>Ingredients.</b> ${esc((p.ingredients||[]).join(', ')) || 'Not available.'}</div>
      </details>
    </div>
    <div class="score">
      <div class="num" style="color:${scoreColour(p.score)}">${Math.round(p.score)}</div>
      <div class="outof">out of 100</div>
    </div>
  </article>`;
}

async function load(view) {
  list.innerHTML = '<div class="empty">Loading…</div>';
  count.textContent = '';
  try {
    const data = await (await fetch('/api/' + view)).json();
    if (!data.products?.length) {
      list.innerHTML = `<div class="empty">Nothing here yet.<br>
        Run the pipeline first:<br><br><code>uv run python -m refresh.run --seed --limit 3</code></div>`;
      return;
    }
    count.textContent = `${data.count} product${data.count === 1 ? '' : 's'}`;
    list.innerHTML = data.products.map(row).join('');
  } catch (e) {
    list.innerHTML = `<div class="empty">Could not load. ${esc(e.message)}</div>`;
  }
}

document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.seg button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  load(b.dataset.view);
});

load('rankings');
</script>
</body>
</html>
